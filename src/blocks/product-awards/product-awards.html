<!--DEV
@@include('blocks/product-awards/product-awards.html')

Product awards (a block of the details column on the product page, after product-info): cards with a medal and a caption.
The number of columns follows the width of the column (1 / 2 / 3), there are no breakpoints: see product-awards.scss.
The medal: img/award.png + img/award.webp (shown at 140x140, the files are 280x280 for retina). The caption repeats the meaning of the medal,
so the image is decorative (alt is empty). The cards are hardcoded on purpose (a placeholder, the templater has no loops; in MODX it becomes a loop,
and each award has its own medal file).
-->
