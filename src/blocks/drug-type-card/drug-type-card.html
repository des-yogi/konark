<!--DEV
@@include('blocks/drug-type-card/drug-type-card.html', {
  "title": "Антибіотики",
  "icon": "antibio"
})

Drug type card: the whole card is a link. Wrap it in <li> where a list is needed (see therapeutic-areas).
The icon is a regular <img> (colors are inlined in the svg), 56x56 from md, 48x48 on mobile; files live in this block's img/ folder.
alt is empty (the link name is the title); the counter is hidden visually on mobile, but stays for screen readers.
The title uses the global .subheading style.

-->

<a href="#" class="drug-type-card">
  <span class="drug-type-card__head">
    <img class="drug-type-card__icon" src="img/@@icon.svg" width="56" height="56" alt="" loading="lazy" decoding="async">
    <span class="drug-type-card__title  subheading">@@title</span>
  </span>
  <span class="drug-type-card__foot">
    <span class="drug-type-card__count">16 позицій</span>
    <svg class="drug-type-card__arrow" width="24" height="24" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#arrow-right"></use></svg>
  </span>
</a>
