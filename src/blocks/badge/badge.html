Badge: a pill with a label and a coloured status dot (the dot is drawn by ::after).
The colour comes from a modifier: badge--red (default, can be omitted), badge--green, badge--yellow, badge--blue.
An empty badge is hidden by :empty, so keep the label EMPTY (no spaces/newlines inside) when there is nothing to show.

-->
