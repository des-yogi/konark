@@include('blocks/map-animated/map-animated.html', {
  "gradient": "dark-light-gr"
})

Animation settings (all optional, ms): data-draw, data-hold, data-gap, data-stagger, data-pulse.
data-margin: the view shows the cities plus this share of their spread on every side (0.3 = 30%).
data-animate="false" shows the routes without motion.
The JSON below is placeholder data: in MODX it comes from the MIGX table.
"direction": "out" — from the hub to the city, "in" — from the city to the hub.
"country" — ISO 3166-1 alpha-2 code, the country gets highlighted.
-->
