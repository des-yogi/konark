<!--DEV
@@include('blocks/product-shops/product-shops.html')

Product shops (a block of the details column on the product page, after product-price): where the product can be ordered.
A section with its own visible heading (h2 in the style of .subheading) and a list of links to the shops.
A shop is a logo picture (png + webp in img/), the logo file already has the color of the shop, so the picture fills the whole pill.
The alt is the name of the shop and gives the name of the link. The links lead to other sites (href="#" is a placeholder).
The shops are hardcoded on purpose (a placeholder, the templater has no loops; in MODX they become a loop,
the three logos are repeated here only to show the full list).
-->
