})

Review card: the author, the date (top right), the stars and the text. The card takes the whole height of its parent
(in a slider the cards of one row are equal). The stars are the stars block (it must be in the build too).
rating: a number from 1 to 5. date: the date as shown, datetime: the same date as YYYY-MM-DD.
-->

<article class="review-card">
  <h3 class="p  review-card__name">@@name</h3>
  <div class="review-card__body">
    @@include('../../blocks/stars/stars.html', {
      "rating": "@@rating",
      "label": "Оцінка @@rating з 5",
      "modifier": ""
    })
    <p class="review-card__text">@@text</p>
  </div>
  <time class="review-card__date" datetime="@@datetime">@@date</time>
</article>
