<!--DEV
@@include('blocks/share/share.html', {
  "mix": "article__share",
  "url": "https%3A%2F%2Fexample.com%2Fnews%2Farticle%2F"
})

mix: extra class from the parent block that sets the outer margins (the block itself has none), "" = no extra class
url: URL-encoded address of the page to share (in MODX: the placeholder of the current page, already encoded)

Share addresses (checked against the official docs in 2026-11, they change from time to time):
- Facebook: https://www.facebook.com/sharer/sharer.php?u={url} (works without an app id but is not in the official docs;
  the documented one is https://www.facebook.com/dialog/share?app_id={app-id}&display=page&href={url} and needs a Facebook app id)
- Telegram: https://t.me/share/url?url={url}[&text={text}]
- LinkedIn: https://www.linkedin.com/sharing/share-offsite/?url={url} (only the url parameter is supported)
- X: https://x.com/intent/tweet?url={url}[&text={text}]
- WhatsApp: https://wa.me/?text={text} (the url goes into the text)
- Viber: viber://forward?text={text} (custom scheme, works where the Viber app is installed; the url goes into the text)

Hidden networks (X, WhatsApp, Viber) are commented out below: uncomment when needed.
The sprite has no "x" icon yet: add it to svg/ before enabling X.
-->

<section class="share  @@mix">
  <h3 class="share__title">Поділитись:</h3>
  <ul class="share__list">
    <li>
      <a class="share__link" href="https://www.facebook.com/sharer/sharer.php?u=@@url" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg width="24" height="24" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#facebook"></use></svg>
      </a>
    </li>
    <li>
      <a class="share__link" href="https://t.me/share/url?url=@@url" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <svg width="24" height="24" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#telegram"></use></svg>
      </a>
    </li>
    <li>
      <a class="share__link" href="https://www.linkedin.com/sharing/share-offsite/?url=@@url" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg width="24" height="24" aria-hidden="true"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="img/sprite-svg.svg#linkedin"></use></svg>
      </a>
    </li>
    <!--

      <a class="share__link" href="https://x.com/intent/tweet?url=@@url" target="_blank" rel="noopener noreferrer" aria-label="X">
