<div class="field-checkbox  @@mod">
  <label class="field-checkbox__name">
    <input class="field-checkbox__input"
           type="checkbox"
           name=""
           value=""
           @@if(checked) checked @@endif @@if(disabled) disabled @@endif
    >
    <span class="field-checkbox__name-text">@@text</span>
    @@if(count)
    <span class="field-checkbox__count">@@count</span>
    @@endif
  </label>
</div>
